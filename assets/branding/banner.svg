<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2733"/>
      <stop offset="1" stop-color="#0b1117"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece8e1" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ece8e1" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="600" fill="url(#bg)"/>
  <!-- big red slashes on the left -->
  <polygon points="0,600 0,430 430,0 610,0 10,600" fill="#ff4655" opacity="0.9"/>
  <polygon points="130,600 730,0 790,0 190,600" fill="#ff4655" opacity="0.35"/>
  <polygon points="250,600 850,0 870,0 270,600" fill="#ff4655" opacity="0.18"/>
  <!-- four shop slots, angled corners -->
  <g transform="translate(560 150)">
    <g fill="url(#slot)" stroke="#ece8e1" stroke-opacity="0.16" stroke-width="2">
      <polygon points="0,0 190,0 210,20 210,120 20,120 0,100"/>
      <polygon points="230,0 420,0 440,20 440,120 250,120 230,100"/>
      <polygon points="460,0 650,0 670,20 670,120 480,120 460,100"/>
      <polygon points="690,0 880,0 900,20 900,120 710,120 690,100"/>
    </g>
    <!-- one slot is the wishlist hit -->
    <polygon points="460,0 650,0 670,20 670,120 480,120 460,100" fill="none" stroke="#ff4655" stroke-width="4"/>
    <path d="M565 28 C571 52 579 60 603 66 C579 72 571 80 565 104 C559 80 551 72 527 66 C551 60 559 52 565 28 Z" fill="#ff4655"/>
  </g>
  <text x="1460" y="400" text-anchor="end" font-family="Inter, sans-serif" font-weight="800"
        font-size="118" letter-spacing="10" fill="#ece8e1">STOREFRONT</text>
  <text x="1460" y="458" text-anchor="end" font-family="Inter, sans-serif" font-weight="500"
        font-size="34" letter-spacing="5" fill="#ece8e1" fill-opacity="0.62">DAILY SHOP · NIGHT MARKET · WISHLIST ALERTS</text>
</svg>
