<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2733"/>
      <stop offset="1" stop-color="#0d141b"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a67"/>
      <stop offset="1" stop-color="#e03a48"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- faint diagonal slashes -->
  <g fill="#ff4655" opacity="0.07">
    <polygon points="-40,760 760,-40 860,-40 60,760"/>
    <polygon points="200,1064 1064,200 1064,330 330,1064"/>
  </g>
  <!-- price tag, angled like a shop slot; kept inside Discord's circular crop -->
  <g transform="rotate(-12 512 512)">
    <polygon points="300,270 650,270 790,512 650,754 300,754 252,706 252,318"
             fill="none" stroke="#ece8e1" stroke-width="18" opacity="0.18" transform="translate(26 26)"/>
    <polygon points="300,270 650,270 790,512 650,754 300,754 252,706 252,318" fill="url(#tag)"/>
    <!-- tag hole -->
    <circle cx="655" cy="512" r="40" fill="#0f1923"/>
    <!-- four-point sparkle: the wishlist hit -->
    <path d="M440 352 C455 452 480 477 580 512 C480 547 455 572 440 672 C425 572 400 547 300 512 C400 477 425 452 440 352 Z"
          fill="#ece8e1"/>
  </g>
</svg>
